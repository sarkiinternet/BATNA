[project]
name = "batna"
version = "0.1.0"
description = "Batna Trades Telegram bot"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46,<47",
    "psycopg[binary]>=3.2,<4",
    "python-telegram-bot[job-queue]>=22.5,<23",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
