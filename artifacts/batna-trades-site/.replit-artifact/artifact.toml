kind = "web"
previewPath = "/"
title = "Batna Trades"
description = "A public landing app for Batna Trades that introduces the crypto signals membership and links users to the Telegram bot and public channel."
version = "1.0.0"
id = "artifacts/batna-trades-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26082

[services.development]
run = "pnpm --filter @workspace/batna-trades-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/batna-trades-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/batna-trades-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26082"
BASE_PATH = "/"
